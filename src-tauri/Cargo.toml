[package]
name = "tauri-station"
version = "0.1.0"
description = "A Tauri Station App"
authors = ["you"]
license = "MIT"
repository = ""
default-run = "tauri-station"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-open", "dialog-save", "shell-open", "fs-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
base64 = "0.21"
uuid = { version = "1.0", features = ["v4"] }
printers = "2.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
